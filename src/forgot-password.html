<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Todo</title>
  <link rel="icon" type="image/png" href="/assets/logo_icon.png">
  <script>
    if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <link href="/output.css" rel="stylesheet">
</head>

<body
  class="font-audiowide bg-[#faf7f5] dark:bg-[#0b1120] text-gray-900 dark:text-white min-h-screen flex flex-col justify-between antialiased">

  <main class="grow flex items-center justify-center px-4 py-8">
    <div
      class="w-full max-w-md bg-[#efeae6] dark:bg-[#0f172a] border dark:border-gray-800 border-gray-300 rounded-3xl p-8 sm:p-10 shadow-2xl relative overflow-hidden">

      <div class="text-center mb-6">
        <a href="/"
          class="flex items-center gap-2 justify-center text-2xl font-bold tracking-wider hover:opacity-80 transition dark:text-white text-black">
          <img src="/assets/logo_icon_with_text_beside.png" alt="Logo" class="h-10 w-auto" id="full_logo">
        </a>
      </div>

      <div class="text-center mb-6">
        <h1 class="text-2xl font-extrabold tracking-tight mb-2 text-black dark:text-white">Forgot Password</h1>
        <p class="text-sm text-gray-600 dark:text-gray-400">Enter your account email to receive a verification code</p>
      </div>

      <form id="forgot-form" class="space-y-5">
        <div>
          <label for="email"
            class="block text-xs font-semibold uppercase tracking-wider dark:text-gray-400 text-gray-700 mb-2">Email
            Address</label>
          <input type="email" id="email" name="email" required placeholder="name@example.com"
            class="w-full px-4 py-3 rounded-xl bg-gray-100 dark:bg-[#070d1e] text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 border border-gray-300 dark:border-gray-800 focus:outline-none focus:border-blue-500 dark:focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition duration-200">
        </div>

        <div id="error" class="text-xs text-red-500"></div>

        <button type="submit"
          class="w-full mt-2 py-3.5 px-4 bg-blue-600 hover:bg-blue-500 active:scale-[0.99] text-white font-semibold rounded-xl shadow-lg shadow-blue-600/30 transition duration-200 cursor-pointer">Send
          Verification Code</button>

        <div class="w-full h-fit flex items-center justify-center pt-2">
          <a href="/login"
            class="text-sm font-semibold text-gray-700 dark:text-gray-300 dark:hover:text-white hover:text-gray-900 transition">Back
            to Login</a>
        </div>
      </form>

    </div>
  </main>

  <footer class="py-6 text-center text-gray-600 dark:text-gray-400 text-xs">© 2026 TodoMint. All rights reserved.</footer>

   <script src="/logo-theme.js"></script>
  <script src="/forgot-password.js" type="module"></script>
</body>

</html>
