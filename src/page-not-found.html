<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found</title>
  <link rel="stylesheet" href="/output.css">
  <link rel="icon" type="image/png" href="/assets/logo_icon.png">
</head>

<body class="bg-white text-gray-900 antialiased">
  <main class="flex min-h-screen flex-col items-center justify-center px-4 py-12 text-center sm:px-6 lg:px-8">
    <div class="flex max-w-md w-full flex-col items-center justify-center space-y-6">
      
      <div class="space-y-2">
        <h1 class="font-serif text-5xl font-bold tracking-tight text-black sm:text-7xl">
          Oops!
        </h1>
        <p class="text-lg font-medium text-gray-600 sm:text-xl">
          You are lost
        </p>
      </div>

      <div class="w-full max-w-xs sm:max-w-sm">
        <img 
          src="/assets/not-found.svg" 
          alt="Page not found illustration" 
          class="h-auto w-full object-contain"
        />
      </div>

      <div>
        <a 
          href="/" 
          class="inline-flex gap-2 items-center justify-center rounded-lg bg-black px-6 py-3 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-gray-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-black"
        >
          <span class="text-2xl">&#8678;</span>
          Go Home
        </a>
      </div>

    </div>
  </main>
</body>

</html>
