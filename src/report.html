<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit Feedback & Bug Report</title>
  <link href="/output.css" rel="stylesheet">
</head>
<body class="bg-gray-50 dark:bg-[#0c1425] text-gray-900 dark:text-gray-100 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6">

  <main class="w-full max-w-2xl bg-white dark:bg-[#131f38] border border-gray-200 dark:border-slate-800 rounded-3xl p-6 sm:p-10 shadow-xl relative">
    <!-- Top Bar Navigation -->
    <div class="flex items-center justify-between mb-8 pb-4 border-b border-gray-100 dark:border-slate-800">
      <a href="/dashboard" class="btn btn-ghost btn-sm gap-2 text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white">
        <svg xmlns="http://www.w3.org/2000/svg" class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Back to Dashboard
      </a>
      <span class="text-xs font-semibold uppercase tracking-wider text-gray-400">Developer Support</span>
    </div>

    <!-- Title Header -->
    <div class="mb-8">
      <h1 class="text-3xl font-bold tracking-tight">Send Feedback or Report an Issue</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-2">
        Have a feature idea or encountered a bug? Send your thoughts directly to the developer.
      </p>
    </div>

    <!-- Feedback Form -->
    <form id="report-page-form" class="flex flex-col gap-6">
      <div class="flex flex-col gap-2">
        <label for="report-type" class="text-xs font-semibold uppercase tracking-wider text-gray-600 dark:text-gray-400">Report Category</label>
        <select id="report-type" required class="w-full px-4 py-3 rounded-xl bg-gray-100 dark:bg-[#0c1425] border border-gray-200 dark:border-slate-700 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800 dark:text-gray-200 cursor-pointer">
          <option value="bug">🐛 Bug Report</option>
          <option value="suggestion">💡 Feature Suggestion</option>
          <option value="feedback">💬 General Feedback</option>
        </select>
      </div>

      <div class="flex flex-col gap-2">
        <label for="report-title" class="text-xs font-semibold uppercase tracking-wider text-gray-600 dark:text-gray-400">Title</label>
        <input type="text" id="report-title" placeholder="Brief summary of the issue or feature" required maxlength="100" class="w-full px-4 py-3 rounded-xl bg-gray-100 dark:bg-[#0c1425] border border-gray-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <div class="flex flex-col gap-2">
        <label for="report-description" class="text-xs font-semibold uppercase tracking-wider text-gray-600 dark:text-gray-400">Detailed Description</label>
        <textarea id="report-description" rows="6" placeholder="Provide step-by-step reproduction steps for bugs, or detailed ideas for feature suggestions..." required class="w-full px-4 py-3 rounded-xl bg-gray-100 dark:bg-[#0c1425] border border-gray-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
      </div>

      <!-- Error / Notification Box -->
      <div id="form-feedback" class="hidden p-4 rounded-xl text-sm font-medium"></div>

      <div class="flex items-center justify-end gap-3 mt-4 pt-4 border-t border-gray-100 dark:border-slate-800">
        <a href="/dashboard" class="btn btn-ghost">Cancel</a>
        <button type="submit" id="submit-btn" class="btn btn-primary px-8">Submit Report</button>
      </div>
    </form>
  </main>

  <script src="/report.js" type="module"></script>
</body>
</html>
