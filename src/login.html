<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Todo</title>
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <script>
    if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <style>
    html.dark {
      background-color: #0b1120;
    }

    html {
      background-color: #faf7f5;
    }
  </style>
  <link href="/output.css" rel="stylesheet">
</head>

<body
  class="font-audiowide bg-[#faf7f5] dark:bg-[#0b1120] text-gray-900 dark:text-white min-h-screen flex flex-col justify-between antialiased selection:bg-blue-500 selection:text-white transition-colors duration-200">

  <main class="grow flex items-center justify-center px-4 py-8">
    <div
      class="w-full max-w-md bg-[#efeae6] dark:bg-[#0f172a] border dark:border-gray-800 border-gray-300 rounded-3xl p-8 sm:p-10 shadow-2xl relative overflow-hidden">
      <div
        class="absolute -top-12 -right-12 w-32 h-32 dark:bg-blue-600/20 bg-blue-400/20 rounded-full blur-2xl pointer-events-none">
      </div>
      <div
        class="w-full flex flex-row items-center justify-between p-2 pb-4 mb-6 border-b dark:border-gray-800 border-gray-300">
        <a href="/"
          class="flex items-center gap-2 text-2xl font-bold tracking-wider hover:opacity-80 transition dark:text-white text-black">
          <img src="/assets/logo.png" alt="Logo" class="w-8 h-8 object-contain">
          Todo
        </a>
        <button id="theme-toggle" type="button" aria-label="Toggle theme"
          class="p-2 rounded-xl bg-gray-200 dark:bg-gray-800 text-gray-800 dark:text-gray-200 hover:opacity-80 transition duration-200 cursor-pointer">
          <svg id="theme-toggle-light-icon" class="hidden w-5 h-5 fill-current" viewBox="0 0 20 20">
            <path
              d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z">
            </path>
          </svg>
          <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5 fill-current" viewBox="0 0 20 20">
            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
          </svg>
        </button>
      </div>

      <div class="text-center mb-8">
        <h1 class="text-3xl font-extrabold tracking-tight mb-2 text-black dark:text-white">Login</h1>
        <p class="text-sm text-gray-600 dark:text-gray-400">Continue organizing your tasks</p>
      </div>

      <form action="/login" method="POST" class="space-y-5">
        <div>
          <label for="email"
            class="block text-xs font-semibold uppercase tracking-wider dark:text-gray-400 text-gray-700 mb-2">
            Email Address
          </label>
          <input type="email" id="email" name="email" required placeholder="name@example.com"
            class="w-full px-4 py-3 rounded-xl bg-gray-100 dark:bg-[#070d1e] text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 border border-gray-300 dark:border-gray-800 focus:outline-none focus:border-blue-500 dark:focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition duration-200">
        </div>

        <div>
          <label for="password"
            class="block text-xs font-semibold uppercase tracking-wider dark:text-gray-400 text-gray-700 mb-2">
            Password
          </label>
          <input type="password" id="password" name="password" required placeholder="••••••••"
            class="w-full px-4 py-3 rounded-xl bg-gray-100 dark:bg-[#070d1e] text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 border border-gray-300 dark:border-gray-800 focus:outline-none focus:border-blue-500 dark:focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition duration-200">
          <div class="w-full flex items-center justify-end mt-2">
            <a href="/forgot-password" class="text-xs text-blue-500 mr-3">Forgot Password?</a>
          </div>
        </div>

        <button type="submit"
          class="w-full mt-2 py-3.5 px-4 bg-blue-600 hover:bg-blue-500 active:scale-[0.99] text-white font-semibold rounded-xl shadow-lg shadow-blue-600/30 transition duration-200 cursor-pointer">
          Sign In
        </button>

        <div class="w-full h-fit flex items-center justify-center pt-2">
          <a href="/register"
            class="text-sm font-semibold text-gray-700 dark:text-gray-300 dark:hover:text-white hover:text-gray-900 transition">
            Don't have an account? <span class="text-blue-500 underline ml-1">Register</span>
          </a>
        </div>
      </form>

      <p class="text-xs text-center text-gray-500 dark:text-gray-400 mt-6">
        By signing in, you agree to our <a href="#"
          class="underline hover:text-gray-800 dark:hover:text-gray-200">Terms</a> and <a href="#"
          class="underline hover:text-gray-800 dark:hover:text-gray-200">Privacy Policy</a>.
      </p>
    </div>
  </main>

  <footer class="py-6 text-center text-gray-600 dark:text-gray-400 text-xs">
    © 2026 Todo. All rights reserved.
  </footer>

  <script src="/theme_changer.js"></script>
  <script type="module">
    import flyToast from '/node_modules/fly-toast/index.js';

    document.addEventListener('DOMContentLoaded', () => {
      const form = document.querySelector('form[action="/login"]');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const data = await res.json();
          if (!res.ok) {
            flyToast(data.error, 'error');
            return;
          }

          if (data.requireVerification) {
            window.location = '/verify?email=' + encodeURIComponent(email);
            return;
          }

          // logged in
          window.location = '/dashboard';
        } catch (err) {
          console.error(err);
          flyToast('Network error', 'error');
        }
      });
    });
  </script>
</body>

</html>
