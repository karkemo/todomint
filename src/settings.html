<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Todo</title>
  <link rel="icon" type="image/png" href="/assets/logo_icon.png">

  <script>
    if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <script src="/settings.js" type="module"></script>
  <script src="/components/fly-toast.js"></script>
  <link rel="stylesheet" href="/output.css">
</head>

<body
  class="font-audiowide bg-[#faf7f5] dark:bg-[#0b1120] text-slate-800 dark:text-slate-100 min-h-screen flex flex-col antialiased">

  <!-- Header -->
  <header class="w-full max-w-4xl mx-auto p-4 flex items-center justify-between">
    <a href="/dashboard"
      class="flex items-center gap-2 text-sm font-semibold text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white transition-colors">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      Back to Dashboard
    </a>

    <a href="/" class="flex flex-row items-center justify-center gap-2 -ml-12 sm:-ml-16">
      <img src="/assets/logo_icon_with_text_beside.png" alt="logo" class="h-10 w-auto" id="full_logo">
      <!-- <p class="text-2xl font-mono dark:text-white text-black">Todo</p> -->
    </a>

    <button id="theme-toggle" type="button" aria-label="Toggle theme"
      class="p-2.5 rounded-xl bg-white dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/60 shadow-sm text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition-all cursor-pointer">
      <svg id="theme-toggle-light-icon" class="hidden w-5 h-5 fill-current" viewBox="0 0 20 20">
        <path
          d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z">
        </path>
      </svg>
      <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5 fill-current" viewBox="0 0 20 20">
        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
      </svg>
    </button>
  </header>

  <!-- Main Card -->
  <main class="flex-1 flex flex-col items-center justify-center p-4 sm:p-6">
    <div
      class="w-full max-w-lg bg-white dark:bg-[#131f38] border border-slate-200/80 dark:border-slate-800 rounded-3xl shadow-xl overflow-hidden p-6 sm:p-8 space-y-6">

      <!-- Header Title -->
      <div class="text-center flex items-center justify-center flex-col">
        <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Settings</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Manage your account and preferences</p>
      </div>

      <!-- Account Settings Group -->
      <div class="space-y-3">
        <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 px-1">
          Account Settings
        </div>

        <button onclick="openModal('name-modal')"
          class="w-full p-3.5 rounded-2xl bg-slate-50 dark:bg-[#0b1120] hover:bg-slate-100 dark:hover:bg-[#080d1a] border border-slate-200/80 dark:border-slate-800 text-slate-800 dark:text-slate-200 flex items-center justify-between text-sm font-medium cursor-pointer transition-all group">
          <div class="flex items-center gap-3">
            <div class="p-2 rounded-xl bg-teal-50 dark:bg-teal-950/40 text-teal-600 dark:text-teal-400">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </div>
            <span>Change Name</span>
          </div>
          <svg class="w-4 h-4 text-slate-400 group-hover:translate-x-0.5 transition-transform" fill="none"
            viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </button>

        <button onclick="openModal('email-modal')"
          class="w-full p-3.5 rounded-2xl bg-slate-50 dark:bg-[#0b1120] hover:bg-slate-100 dark:hover:bg-[#080d1a] border border-slate-200/80 dark:border-slate-800 text-slate-800 dark:text-slate-200 flex items-center justify-between text-sm font-medium cursor-pointer transition-all group">
          <div class="flex items-center gap-3">
            <div class="p-2 rounded-xl bg-blue-50 dark:bg-blue-950/40 text-blue-600 dark:text-blue-400">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
            </div>
            <span>Change Email</span>
          </div>
          <svg class="w-4 h-4 text-slate-400 group-hover:translate-x-0.5 transition-transform" fill="none"
            viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </button>

        <button onclick="openModal('password-modal')"
          class="w-full p-3.5 rounded-2xl bg-slate-50 dark:bg-[#0b1120] hover:bg-slate-100 dark:hover:bg-[#080d1a] border border-slate-200/80 dark:border-slate-800 text-slate-800 dark:text-slate-200 flex items-center justify-between text-sm font-medium cursor-pointer transition-all group">
          <div class="flex items-center gap-3">
            <div class="p-2 rounded-xl bg-purple-50 dark:bg-purple-950/40 text-purple-600 dark:text-purple-400">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </div>
            <span>Change Password</span>
          </div>
          <svg class="w-4 h-4 text-slate-400 group-hover:translate-x-0.5 transition-transform" fill="none"
            viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </button>
      </div>

      <!-- Todo Behavior Group -->
      <div class="space-y-3">
        <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 px-1">
          Todo Behavior
        </div>

        <div
          class="p-3.5 rounded-2xl bg-slate-50 dark:bg-[#0b1120] border border-slate-200/80 dark:border-slate-800 flex items-center justify-between gap-4">
          <div class="flex items-center gap-3">
            <div class="p-2 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </div>
            <span class="text-sm font-medium text-slate-800 dark:text-slate-200">Manage Completed</span>
          </div>

          <select id="completed-todos-action"
            class="bg-white dark:bg-[#131f38] text-slate-800 dark:text-slate-200 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-1.5 text-xs font-medium outline-none focus:ring-2 focus:ring-blue-500 transition-all cursor-pointer">
            <option value="keep">Keep as it is</option>
            <option value="delete">Delete Automatically</option>
            <option value="move">Move to Completed</option>
          </select>
          <div id="completed-action-message" class="text-xs text-slate-500 dark:text-slate-400 mt-2"></div>
        </div>
      </div>

      <!-- Preferred Font Section -->
      <div class="space-y-3">
        <div class="flex items-center justify-between px-1">
          <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">
            Preferred Font
          </div>
          <div id="font-action-message" class="text-xs text-slate-500 dark:text-slate-400"></div>
        </div>

        <div class="grid grid-cols-3 gap-3">

          <!-- Option 1: Sans-Serif -->
          <label
            class="relative flex flex-col items-center justify-center p-4 rounded-2xl bg-slate-50 dark:bg-[#0b1120] border-2 border-slate-200/80 dark:border-slate-800 cursor-pointer hover:border-blue-400 dark:hover:border-blue-500 transition-all text-center select-none group has-checked:border-blue-600 dark:has-checked:border-blue-500 has-checked:bg-blue-50/30 dark:has-checked:bg-blue-950/20">
            <input type="radio" name="preferred_font" value="sans-serif" class="sr-only peer" />
            <span class="font-sans text-xl font-bold text-slate-800 dark:text-slate-200">Aa</span>
            <span class="text-xs font-medium text-slate-500 dark:text-slate-400 mt-1">Default</span>

            <div
              class="absolute top-2 left-2 hidden peer-checked:flex items-center justify-center size-5 bg-blue-600 text-white rounded-full shadow-sm">
              <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
              </svg>
            </div>
          </label>

          <!-- Option 2: Audiowide -->
          <label
            class="relative flex flex-col items-center justify-center p-4 rounded-2xl bg-slate-50 dark:bg-[#0b1120] border-2 border-slate-200/80 dark:border-slate-800 cursor-pointer hover:border-blue-400 dark:hover:border-blue-500 transition-all text-center select-none group has-checked:border-blue-600 dark:has-checked:border-blue-500 has-checked:bg-blue-50/30 dark:has-checked:bg-blue-950/20">
            <input type="radio" name="preferred_font" value="audiowide" class="sr-only peer" />
            <span class="font-audiowide text-xl font-bold text-slate-800 dark:text-slate-200">Aa</span>
            <span class="text-xs font-medium text-slate-500 dark:text-slate-400 mt-1">Audiowide</span>

            <div
              class="absolute top-2 left-2 hidden peer-checked:flex items-center justify-center size-5 bg-blue-600 text-white rounded-full shadow-sm">
              <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
              </svg>
            </div>
          </label>

          <!-- Option 3: Cursive -->
          <label
            class="relative flex flex-col items-center justify-center p-4 rounded-2xl bg-slate-50 dark:bg-[#0b1120] border-2 border-slate-200/80 dark:border-slate-800 cursor-pointer hover:border-blue-400 dark:hover:border-blue-500 transition-all text-center select-none group has-checked:border-blue-600 dark:has-checked:border-blue-500 has-checked:bg-blue-50/30 dark:has-checked:bg-blue-950/20">
            <input type="radio" name="preferred_font" value="cursive" class="sr-only peer" />
            <span class="font-serif italic text-xl font-bold text-slate-800 dark:text-slate-200">Aa</span>
            <span class="text-xs font-medium text-slate-500 dark:text-slate-400 mt-1">Cursive</span>

            <div
              class="absolute top-2 left-2 hidden peer-checked:flex items-center justify-center size-5 bg-blue-600 text-white rounded-full shadow-sm">
              <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
              </svg>
            </div>
          </label>

        </div>
      </div>

      <!-- Danger Zone Group -->
      <div class="space-y-3 pt-2">
        <div class="text-[11px] font-bold uppercase tracking-wider text-red-500/80 dark:text-red-400/80 px-1">
          Danger Zone
        </div>

        <div class="space-y-2">
          <button id="clear-todos-btn"
            class="w-full py-2.5 px-4 rounded-xl text-sm font-semibold bg-red-50 dark:bg-red-950/30 hover:bg-red-100 dark:hover:bg-red-900/40 text-red-600 dark:text-red-400 transition-all border border-red-100 dark:border-red-900/30 flex items-center justify-center gap-2 cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" class="size-4" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
            <span id="clear-btn-text">Clear Todos</span>
          </button>

          <a href="/logout"
            class="w-full py-2.5 px-4 rounded-xl text-sm font-semibold bg-red-50 dark:bg-red-950/30 hover:bg-red-100 dark:hover:bg-red-900/40 text-red-600 dark:text-red-400 transition-all border border-red-100 dark:border-red-900/30 flex items-center justify-center gap-2 cursor-pointer">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            Logout
          </a>

          <button id="delete-account-btn"
            class="w-full py-2 px-4 rounded-xl text-xs font-medium text-red-500/70 hover:text-red-600 dark:text-red-400/60 dark:hover:text-red-400 transition-colors flex items-center justify-center cursor-pointer">
            Delete Account
          </button>
        </div>
      </div>

    </div>
  </main>

  <!-- MODALS -->

  <!-- Name Modal -->
  <div id="name-modal"
    class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div
      class="bg-white dark:bg-[#131f38] border border-slate-200 dark:border-slate-800 w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4">
      <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">Change Name</h3>

      <form class="space-y-3 text-sm">
        <div>
          <label class="block text-xs font-medium mb-1 text-slate-500 dark:text-slate-400">New Name</label>
          <input id="new-name" type="text" required placeholder="John Due"
            class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700/80 bg-slate-50 dark:bg-[#0b1120] text-slate-800 dark:text-slate-100 outline-none focus:ring-2 focus:ring-blue-500 transition-all" />
        </div>

        <div class="flex items-center justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal('name-modal')"
            class="px-4 py-2 rounded-xl text-xs font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer transition-colors">Cancel</button>
          <button type="submit"
            class="px-4 py-2 rounded-xl text-xs font-medium bg-blue-600 hover:bg-blue-700 text-white cursor-pointer transition-colors shadow-sm">Save
            Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Email Modal -->
  <div id="email-modal"
    class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div
      class="bg-white dark:bg-[#131f38] border border-slate-200 dark:border-slate-800 w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4">
      <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">Change Email</h3>

      <form class="space-y-3 text-sm">
        <div>
          <label class="block text-xs font-medium mb-1 text-slate-500 dark:text-slate-400">New Email</label>
          <input id="new-email" type="email" required placeholder="name@example.com"
            class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700/80 bg-slate-50 dark:bg-[#0b1120] text-slate-800 dark:text-slate-100 outline-none focus:ring-2 focus:ring-blue-500 transition-all" />
        </div>

        <div>
          <label class="block text-xs font-medium mb-1 text-slate-500 dark:text-slate-400">Current Password</label>
          <input id="current-email-password" type="password" required placeholder="••••••••"
            class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700/80 bg-slate-50 dark:bg-[#0b1120] text-slate-800 dark:text-slate-100 outline-none focus:ring-2 focus:ring-blue-500 transition-all" />
        </div>

        <div class="flex items-center justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal('email-modal')"
            class="px-4 py-2 rounded-xl text-xs font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer transition-colors">Cancel</button>
          <button type="submit"
            class="px-4 py-2 rounded-xl text-xs font-medium bg-blue-600 hover:bg-blue-700 text-white cursor-pointer transition-colors shadow-sm">Save
            Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Password Modal -->
  <div id="password-modal"
    class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div
      class="bg-white dark:bg-[#131f38] border border-slate-200 dark:border-slate-800 w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4">
      <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">Change Password</h3>

      <form class="space-y-3 text-sm">
        <div>
          <label class="block text-xs font-medium mb-1 text-slate-500 dark:text-slate-400">Current Password</label>
          <input id="current-password" type="password" required placeholder="••••••••"
            class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700/80 bg-slate-50 dark:bg-[#0b1120] text-slate-800 dark:text-slate-100 outline-none focus:ring-2 focus:ring-blue-500 transition-all" />
        </div>

        <div>
          <label class="block text-xs font-medium mb-1 text-slate-500 dark:text-slate-400">New Password</label>
          <input id="new-password" type="password" required placeholder="••••••••"
            class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700/80 bg-slate-50 dark:bg-[#0b1120] text-slate-800 dark:text-slate-100 outline-none focus:ring-2 focus:ring-blue-500 transition-all" />
        </div>

        <div class="flex items-center justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal('password-modal')"
            class="px-4 py-2 rounded-xl text-xs font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer transition-colors">Cancel</button>
          <button type="submit"
            class="px-4 py-2 rounded-xl text-xs font-medium bg-blue-600 hover:bg-blue-700 text-white cursor-pointer transition-colors shadow-sm">Update
            Password</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/font.js"></script>
  <script src="/theme_changer.js"></script>
  <script src="/show_confirm.js"></script>
  <script src="/logo-theme.js"></script>

  <script>
    function openModal(id) {
      const modal = document.getElementById(id);
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      modal.classList.remove('flex');
      modal.classList.add('hidden');
    }
  </script>
</body>

</html>
