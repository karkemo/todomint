<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Todo</title>
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <script src="/profile.js"></script>
  <script>
    if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <style>
    html.dark {
      background-color: #0b1120;
    }

    html {
      background-color: #faf7f5;
    }
  </style>
  <link rel="stylesheet" href="/output.css">
</head>

<body class="bg-[#faf7f5] dark:bg-[#0b1120] text-slate-800 dark:text-slate-100 font-audiowide min-h-screen flex flex-col antialiased">

  <header class="w-full max-w-4xl mx-auto p-4 flex items-center justify-between">
    <a href="/dashboard" class="flex items-center gap-2 text-sm font-semibold text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white transition-colors">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      Back to Dashboard
    </a>

    <button id="theme-toggle" type="button" aria-label="Toggle theme"
      class="p-2.5 rounded-xl bg-white dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/60 shadow-sm text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition-all cursor-pointer">
      <svg id="theme-toggle-light-icon" class="hidden w-5 h-5 fill-current" viewBox="0 0 20 20">
        <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z"></path>
      </svg>
      <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5 fill-current" viewBox="0 0 20 20">
        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
      </svg>
    </button>
  </header>

  <main class="flex-1 flex flex-col items-center justify-center p-4 sm:p-6">
    <div class="w-full max-w-md bg-white dark:bg-[#131f38] border border-slate-200/80 dark:border-slate-800 rounded-3xl shadow-2xl overflow-hidden relative transition-all">
      
      <div class="h-28 bg-linear-to-r from-blue-600 to-indigo-600 dark:from-blue-700 dark:to-indigo-900 w-full"></div>

      <div class="px-6 pb-6 relative flex flex-col items-center">
        
        <div class="-mt-14 mb-4">
          <div class="w-28 h-28 sm:w-32 sm:h-32 rounded-full bg-slate-100 dark:bg-slate-900 ring-4 ring-white dark:ring-[#131f38] shadow-lg flex items-center justify-center overflow-hidden">
            <span id="username" class="font-audiowide text-4xl sm:text-5xl font-bold text-blue-600 dark:text-blue-400">
              <span class="loading loading-spinner loading-md"></span>
            </span>
          </div>
        </div>

        <div class="w-full space-y-2 mb-6">
          <div class="p-3.5 rounded-2xl bg-slate-50 dark:bg-[#0c1425] border border-slate-100 dark:border-slate-800/80 flex items-center justify-between">
            <span class="text-xs font-semibold tracking-wider text-slate-400 uppercase">User Name</span>
            <span id="name" class="font-mono text-xs font-medium text-slate-700 dark:text-slate-300" title="User ID"></span>
          </div>

          <div class="p-3.5 rounded-2xl bg-slate-50 dark:bg-[#0c1425] border border-slate-100 dark:border-slate-800/80 flex items-center justify-between">
            <span class="text-xs font-semibold tracking-wider text-slate-400 uppercase">User ID</span>
            <span id="id" class="font-mono text-xs font-medium text-slate-700 dark:text-slate-300" title="User ID"></span>
          </div>

          <div class="p-3.5 rounded-2xl bg-slate-50 dark:bg-[#0c1425] border border-slate-100 dark:border-slate-800/80 flex items-center justify-between">
            <span class="text-xs font-semibold tracking-wider text-slate-400 uppercase">Email</span>
            <span id="email" class="text-xs font-medium text-slate-700 dark:text-slate-300 truncate max-w-50"></span>
          </div>

          <div class="p-3.5 rounded-2xl bg-slate-50 dark:bg-[#0c1425] border border-slate-100 dark:border-slate-800/80 flex items-center justify-between">
            <span class="text-xs font-semibold tracking-wider text-slate-400 uppercase">Joined</span>
            <span id="createdAt" class="text-xs font-medium text-slate-700 dark:text-slate-300"></span>
          </div>
        </div>

        <div class="w-full space-y-2 mb-6">
          <a href="/settings" class="w-full py-2.5 px-4 rounded-xl text-sm font-medium bg-slate-100 hover:bg-slate-200 dark:bg-slate-800/70 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 transition-colors flex items-center justify-center gap-2 cursor-pointer">
            <svg class="w-4 h-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            Settings
          </a>

          <a href="/report" class="w-full py-2.5 px-4 rounded-xl text-sm font-medium bg-slate-100 hover:bg-slate-200 dark:bg-slate-800/70 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 transition-colors flex items-center justify-center gap-2 cursor-pointer">
            <svg class="w-4 h-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z" />
            </svg>
            Report Feedback / Bug / Suggestion
          </a>
        </div>

        <div class="relative w-full flex items-center justify-center mb-4">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-red-200 dark:border-red-950/80"></div>
          </div>
          <div class="relative px-3 bg-white dark:bg-[#131f38] text-[10px] font-extrabold tracking-widest uppercase text-red-500/80 dark:text-red-400/80">
            Danger Zone
          </div>
        </div>

        <div class="w-full space-y-2">
          <a href="/logout" class="w-full py-2.5 px-4 rounded-xl text-sm font-semibold bg-red-50 dark:bg-red-950/30 hover:bg-red-100 dark:hover:bg-red-900/40 text-red-600 dark:text-red-400 transition-colors border border-red-100 dark:border-red-900/30 flex items-center justify-center gap-2 cursor-pointer">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            Logout
          </a>

          <button id="delete-account-btn" class="w-full py-2.5 px-4 rounded-xl text-sm font-semibold bg-transparent hover:bg-red-50 dark:hover:bg-red-950/20 text-red-500/80 dark:text-red-400/70 hover:text-red-600 transition-colors flex items-center justify-center gap-2 cursor-pointer">
            Delete Account
          </button>
        </div>

      </div>
    </div>
  </main>

  <script src="/theme_changer.js"></script>
</body>

</html>
