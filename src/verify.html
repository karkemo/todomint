<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <title>Verify Account</title>
  
  <script>
    if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  
  <link rel="stylesheet" href="/output.css">
</head>
<body class="p-6 font-sans bg-gray-50 text-gray-900 dark:bg-[#0b1120] dark:text-gray-100 min-h-screen flex items-center justify-center transition-colors">
  
  <main class="w-full max-w-md mx-auto bg-white dark:bg-[#111827]! border border-gray-200 dark:border-gray-800! p-8 rounded-xl shadow-xl transition-colors">
    <h1 class="text-2xl font-semibold mb-2 text-gray-900 dark:text-white!">Verify Your Account</h1>
    <p class="text-sm text-gray-600 dark:text-gray-400! mb-6">Enter the 6-digit code sent to your email.</p>

    <form id="verify-form" class="space-y-4">
      <div>
        <label for="code" class="block text-sm font-medium text-gray-700 dark:text-gray-300! mb-2">
          Verification Code
        </label>
        <input 
          id="code" 
          name="code" 
          type="text" 
          maxlength="6" 
          required 
          placeholder="123456"
          class="block w-full border border-gray-300 dark:border-gray-700! rounded-lg p-3 bg-white dark:bg-[#1a202c]! text-gray-900 dark:text-white! placeholder-gray-400 dark:placeholder-gray-500! focus:ring-2 focus:ring-blue-500 outline-none transition-colors" 
        />
      </div>

      <div id="error" class="text-red-600 dark:text-red-400! text-sm font-medium mb-6"></div>

      <button 
        type="submit" 
        class="cursor-pointer w-full bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-3 rounded-lg shadow transition-colors"
      >
        Verify
      </button>
    </form>
  </main>

  <script src="/verify.js"></script>
</body>
</html>
